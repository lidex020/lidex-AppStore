  const totalLikes = myApps.reduce((s, r) => s + countLikes(r.aTag), 0);

  out += '<div class="statrow" style="margin:22px 2px 6px">' +
    '<div class="stat"><b>' + myApps.filter(r => !r.deleted).length + '</b><span>published apps</span></div>' +

  out += '<div class="section"><div class="sechead"><h2>Your apps</h2></div>';

    out += '<div class="empty"><div class="big">📦</div><h3>No apps yet</h3><p>Publish your first web3 app — it takes about a minute and it\'s free forever.</p>' +

  let out = '<div class="sechead" style="margin-bottom:20px"><h2 style="font-size:24px">Settings</h2></div>';
  out += '<div class="card"><h3>' + icon('bookmark', 15) + ' Storage</h3>' +
    '<div class="kv"><span class="k">Mode</span><span class="v">' + storeName + '</span></div>' +
    '<div class="kv"><span class="k">Cached events</span><span class="v">' + S.seenEvents.size + '</span></div>' +
    '<p class="fhint">All Lidex data lives in your browser only — listings, pins and your identity never touch a server of ours (there is none). The network copy of listings lives on public Nostr relays as signed events.</p></div>';
  out += relayPanelHtml(true);
  out += '<div class="card"><h3>' + icon('key', 15) + ' Publisher identity</h3>' +
    (S.identity ? '<div class="kv"><span class="k">npub</span><span class="v mono" style="word-break:break-all">' + esc(S.identity.npub || npubEncode(S.identity.pubkey)) + '</span></div>' +
      '<div class="kv"><span class="k">Created</span><span class="v">' + fmtDate(S.identity.created || 0) + ' (' + (S.identity.how === 'wallet' ? 'derived from wallet signature' : S.identity.how) + ')</span></div>' +
      '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">' +
      '<button class="btn btn-ghost btn-sm" data-action="export-nsec">' + icon('download', 13) + ' Export nsec key</button>' +
      '<button class="btn btn-danger btn-sm" data-action="forget-identity">' + icon('trash', 13) + ' Forget on this device</button></div>' +
      '<p class="fhint">Your nsec is the master key to your listings — keep it offline. Anyone with it can update or unpublish your apps.</p>'
      : '<p class="fhint">No publisher identity on this device yet.</p><button class="btn btn-primary btn-sm" data-action="ensure-identity">' + icon('key', 13) + ' Create / import</button>') + '</div>';
  out += '<div class="card"><h3>' + icon('code', 15) + ' Data</h3>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
    '<button class="btn btn-ghost btn-sm" data-action="export-backup">' + icon('download', 13) + ' Export backup</button>' +
    '<label class="btn btn-ghost btn-sm" style="cursor:pointer">' + icon('upload', 13) + ' Import app file (.lidex.json)' +
    '<input type="file" id="import-file" accept=".json,application/json" style="display:none"></label>' +
    '<button class="btn btn-danger btn-sm" data-action="clear-cache">' + icon('trash', 13) + ' Clear network cache</button>' +
    '<button class="btn btn-danger btn-sm" data-action="factory-reset">' + icon('warn', 13) + ' Factory reset</button></div>' +
    '<p class="fhint">Import verifies the Nostr signature locally before accepting — tampered files are rejected.</p></div>';
  return out;
}

/* ---------------- about ---------------- */
function aboutView() {
  return '<div class="sechead" style="margin-bottom:6px"><h2 style="font-size:24px">How Lidex works</h2></div>' +
    '<div class="card"><p style="color:var(--muted);font-size:14px">Lidex is an app store with <b>no backend, no database and no gatekeepers</b> — and it\'s not a demo. The entire product is this single HTML file. Here\'s how that\'s possible:</p>' +
    '<div class="steps" style="margin-top:8px">' +
    '<div class="step"><div class="n"></div><div><b>Your wallet is your developer account</b><p>Connect MetaMask (or any EVM wallet) and sign one free message. That signature deterministically derives your Lidex publisher key (a Nostr identity). No transaction, no gas, no email, no signup — and no server ever sees your keys.</p></div></div>' +
    '<div class="step"><div class="n"></div><div><b>Publishing = signing</b><p>Your listing is a small manifest (name, links, icon, screenshots, description…) that is hashed with keccak256 and signed by your wallet, then wrapped in a Nostr event signed by your publisher key. Two independent signatures, both verified by every Lidex client.</p></div></div>' +
    '<div class="step"><div class="n"></div><div><b>Public relays are the database</b><p>Signed events are broadcast to public Nostr relays — open, federated infrastructure anyone can run. Lidex reads them back, verifies every signature in your browser, and rebuilds the store. No company owns the listings; censorship requires censoring the whole Nostr network.</p></div></div>' +
    '<div class="step"><div class="n"></div><div><b>Only you can update or unpublish</b><p>Updates (kind 30078, NIP-78) replace your listing only when signed by the same publisher key. Reviews are signed notes; likes are signed reactions. Everyone can publish, nobody can be removed by anyone but themselves.</p></div></div>' +
    '</div></div>' +
    '<div class="card"><h3>' + icon('shield', 15) + ' Trust model</h3>' +
    '<p style="color:var(--muted);font-size:13.5px">Every listing page shows a <b>Trust panel</b> with checks computed locally: is the Nostr signature valid? Does the wallet signature recover to the developer address shown? Nothing is trusted because a server said so. Directory listings are editorial entries added by Lidex with links to official sites — they are clearly labeled and unsigned. As with any open network, verify before you connect a wallet to a dapp: check domains, reviews and signatures.</p></div>' +
    '<div class="card"><h3>' + icon('warn', 15) + ' Honest limitations</h3>' +
    '<p style="color:var(--muted);font-size:13.5px">· Relays accept events up to ~64 KB, so screenshots are compressed automatically.<br>' +
    '· "Unpublish" removes listings from relays that honor deletions — cached copies and archives may persist, as with any permissionless network.<br>' +
    '· Reviews and likes can\'t be faked cheaply (they need valid keys) but they can\'t be censored either.<br>' +
    '· This file must be hosted somewhere static (any web host, IPFS, or opened locally) — that\'s the whole "backend".</p></div>' +
    '<div class="card"><h3>' + icon('info', 15) + ' Protocol</h3>' +
    '<div class="kv"><span class="k">App listings</span><span class="v mono">Nostr kind 30078 · tag l=lidex</span></div>' +
    '<div class="kv"><span class="k">Reviews</span><span class="v mono">kind 1 · l=lidex-review</span></div>' +
    '<div class="kv"><span class="k">Likes</span><span class="v mono">kind 7 · l=lidex-like</span></div>' +
    '<div class="kv"><span class="k">Deletions</span><span class="v mono">kind 5 (NIP-09)</span></div>' +
    '<div class="kv"><span class="k">Manifest sig</span><span class="v mono">EIP-191 personal_sign over keccak256</span></div>' +
    '<div class="kv"><span class="k">Identity</span><span class="v mono">sha256(wallet signature) → Nostr key</span></div>' +
    '<p class="fhint">Any client can implement the same protocol — the spec is the event format above. Interoperability is the point.</p></div>';
}

/* ---------------- router ---------------- */
function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}
window.addEventListener('hashchange', render);
function parseRoute() {
  const h = decodeURIComponent(location.hash || '#/');
  let m;
  if ((m = h.match(/^#\/search\??(.*)$/))) { S.route = { name: 'search', q: new URLSearchParams(m[1]).get('q') || '' }; }
  else if ((m = h.match(/^#\/category\/([a-z]+)$/))) S.route = { name: 'category', slug: m[1] };
  else if ((m = h.match(/^#\/app\/(.+)$/))) S.route = { name: 'app', id: m[1] };
  else if ((m = h.match(/^#\/edit\/(.+)$/))) S.route = { name: 'edit', id: m[1] };
  else if (h === '#/publish') S.route = { name: 'publish' };
  else if (h === '#/dev') S.route = { name: 'dev' };
  else if (h === '#/my') S.route = { name: 'my' };
  else if (h === '#/settings') S.route = { name: 'settings' };
  else if (h === '#/about') S.route = { name: 'about' };
  else S.route = { name: 'discover' };
}
function render() {
  parseRoute();
  const r = S.route;
  let body = '';
  switch (r.name) {
    case 'search': body = searchView(); break;
    case 'category': body = categoryView(r.slug); break;
    case 'app': body = appDetailView(r.id); break;
    case 'publish': body = publishView(null); break;
    case 'edit': body = publishView(r.id); break;
    case 'dev': body = devView(); break;
    case 'my': body = myAppsView(); break;
    case 'settings': body = settingsView(); break;
    case 'about': body = aboutView(); break;
    default: body = discoverView();
  }
  const scroll = window.scrollY;
  $('#app').innerHTML = topbarHtml() + '<div class="main">' + bannersHtml() + body + '</div>' + footerHtml() + bottomNavHtml();
  if (r.name === 'publish' || r.name === 'edit') mountPublish();
  if (r.name === 'settings') mountSettings();
  if (r.name === 'search') {
    const inp = $('#topsearch');
    if (inp) {
      inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
      const clear = inp.parentElement.querySelector('.s-clear');
      if (clear && inp.value) clear.style.display = 'block';
    }
  }
  window.scrollTo(0, Math.min(scroll, 40));
}
function mountSettings() {
  const imp = $('#import-file');
  if (imp) imp.addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const rec = await importLidexText(await f.text());
      toast(rec && !rec.deleted ? 'Imported: ' + rec.manifest.name : 'Imported', 'ok');
      if (rec) go('#/app/' + encodeURIComponent(rec.aTag));
    } catch (err) { toast('Import failed: ' + err.message, 'err'); }
    e.target.value = '';
  });
}

/* ---------------- global actions ---------------- */
const ACTIONS = {
  'go': el => go(el.dataset.href),
  'open-app': el => { if (el.dataset.url) openUrl(el.dataset.url); },
  'open-app-card': el => go('#/app/' + encodeURIComponent(el.dataset.id)),
  'publish': async () => {
    if (!S.identity) {
      const id = await ensureIdentity();
      if (!id) return;
    }
    go('#/publish');
  },
  'ensure-identity': async () => { const id = await ensureIdentity(); if (id) render(); },
  'connect-wallet': async el => {
    try { const a = await Wallet.connect(); toast('Wallet connected: ' + shortKey(a, 4), 'ok'); render(); }
    catch (e) { if (!e || !e.silent) toast(e.message, 'err'); }
  },
  'wallet-menu': () => {
    const a = S.wallet.address;
    showModal('Wallet', ((S.wallet && S.wallet.name) ? '<div class="kv"><span class="k">Wallet</span><span class="v">' + esc(S.wallet.name) + '</span></div>' : '') + '<div class="kv"><span class="k">Address</span><span class="v mono">' + esc(a) + '</span></div>' +
      (S.identity && S.identity.wallet === a.toLowerCase() ? '<div class="kv"><span class="k">Publisher key</span><span class="v">derived from this wallet ✓</span></div>' : '<p class="fhint">Connect this wallet while publishing to sign manifests with it.</p>'),
      [{ label: 'Copy address', fn: () => copyText(a) },
       { label: 'Disconnect', danger: true, fn: () => { S.wallet = null; render(); } }]);
  },
  'like': async el => { await toggleLike(findApp(el.dataset.id)); },
  'pin': async el => {
    const id = el.dataset.id;
    if (S.pins.includes(id)) { S.pins = S.pins.filter(x => x !== id); toast('Removed from My Apps'); }
    else { S.pins.push(id); toast('Pinned to My Apps', 'ok'); }
    await savePrefs(); render();
  },
  'share-app': el => {
    const u = findApp(el.dataset.id); if (!u) return;
    const url = location.origin === 'null' || location.protocol === 'file:'
      ? 'Export the signed .lidex.json file to share this app — it works anywhere.'
      : location.origin + location.pathname + '#/app/' + encodeURIComponent(u.id);
    if (typeof url === 'string' && url.startsWith('Export')) {
      showModal('Share ' + esc(u.name), '<p class="sub">This page is running locally, so there\'s no shareable URL. Share the app\'s signed file instead — anyone can import it in their Lidex.</p>',
        [{ label: 'Export file', primary: true, fn: () => exportApp(u) }, { label: 'Close' }]);
    } else copyText(url);
  },
  'export-app': el => exportApp(findApp(el.dataset.id)),
  'hide-app': async el => {
    S.hidden.push(el.dataset.id);
    await savePrefs(); toast('Hidden from your Discover (undo in Settings)'); go('#/');
  },
  'unpublish': el => {
    const u = findApp(el.dataset.id); if (!u || !u.record) return;
    confirmModal('Unpublish ' + esc(u.name) + '?',
      'Your listing is replaced with a tombstone on relays and a deletion event (NIP-09) is broadcast. On permissionless networks, archives may retain copies — unpublish is best-effort by design.',
      'Unpublish', async () => {
        try {
          const r = await doUnpublish(u.record);
          toast('Unpublished (' + r.accepted.length + ' relays confirmed)', 'ok');
          render();
        } catch (e) { toast('Failed: ' + e.message, 'err'); }
      }, true);
  },
  'edit-app': el => go('#/edit/' + encodeURIComponent(el.dataset.id)),
  'submit-form': () => submitForm(),
  'icon-reset': () => { if (FORM.v) { FORM.v.icon = ''; const img = $('#icon-img'); if (img) img.src = formIconDataUrl(); } },
  'submit-review': async el => {
    const u = findApp(el.dataset.id); if (!u) return;
    const rating = FORM._starVal || (myReview(u.id) ? myReview(u.id).rating : 0);
    const text = ($('#review-text') || {}).value || '';
    if (!rating) { toast('Tap the stars to rate first', 'err'); return; }
    await submitReview(u, rating, text);
  },
  'delete-review': async el => {
    const u = findApp(el.dataset.id); if (!u) return;
    const mine = myReview(u.id); if (!mine) return;
    const ident = S.identity;
    confirmModal('Delete your review?', '', 'Delete', async () => {
      const del = { pubkey: ident.pubkey, created_at: nowSec(), kind: 5, tags: [['e', mine.ev.id], ['l', 'lidex-review'], ['client', 'lidex']], content: 'Lidex: delete review' };
      signNostrEvent(ident.sk, del);
      handleEvent(del, { persist: true });
      await RelayPool.publish(del, 6000);
      toast('Review deleted'); dirty();
    }, true);
  },
  'copy': el => copyText(el.dataset.copy),
  'view-npub': el => {
    const pk = el.dataset.npub;
    showModal('Publisher', '<div class="kv"><span class="k">npub</span><span class="v mono" style="word-break:break-all">' + esc(npubEncode(pk)) + '</span></div>' +
      '<div class="kv"><span class="k">hex</span><span class="v mono" style="word-break:break-all;font-size:11px">' + esc(pk) + '</span></div>' +
      '<div class="kv"><span class="k">Their apps</span><span class="v">' + Array.from(S.apps.values()).filter(r => r.pubkey === pk && !r.deleted).length + ' on network</span></div>',
      [{ label: 'Copy npub', fn: () => copyText(npubEncode(pk)) }, { label: 'Close', primary: true }]);
  },
  'relays': () => go('#/settings'),
  'relay-remove': async el => {
    S.relays = S.relays.filter(u => u !== el.dataset.url);
    await savePrefs();
    const s = RelayPool.socks.get(el.dataset.url);
    if (s && s.ws) { try { s.ws.close(); } catch (e) {} }
    RelayPool.socks.delete(el.dataset.url);
    RelayPool.refreshCount(); render();
  },
  'relay-add': () => {
    const m = showModal('Add relay', '<label class="f">Relay WebSocket URL</label><input type="text" id="relay-in" placeholder="wss://relay.example.com" style="font-family:var(--mono)"><div class="ferr" id="relay-err">Must be a wss:// URL</div>',
      [{ label: 'Cancel' }, { label: 'Add', primary: true, fn: async () => {
        const url = m.el.querySelector('#relay-in').value.trim();
        if (!/^wss:\/\/.+\..+/.test(url)) { m.el.querySelector('#relay-err').classList.add('show'); return false; }
        if (S.relays.includes(url)) { toast('Already added'); return true; }
        S.relays.push(url); await savePrefs();
        RelayPool.connect(url, true); RelayPool.refreshCount();
        toast('Relay added'); render();
        return true;
      }, keep: true }]);
  },
  'relay-reset': async () => {
    S.relays = DEFAULT_RELAYS.slice(); await savePrefs();
    RelayPool.init(S.relays); render(); toast('Default relays restored');
  },
  'retry-relays': () => {
    S.relays.forEach(url => RelayPool.connect(url, true));
    RelayPool.refreshCount();
    toast('Reconnecting…'); render();
  },
  'sync-mine': () => { syncMyEvents(); toast('Syncing your events from relays…'); },
  'export-nsec': () => {
    if (!S.identity) return;
    const nsec = nsecEncode(S.identity.sk);
    showModal('Your publisher key', '<p class="sub">Store this offline. It is the ONLY way to update your apps.</p>' +
      '<div class="kv"><span class="k">nsec</span><span class="v mono" style="word-break:break-all">' + esc(nsec) + '</span></div>',
      [{ label: 'Copy', fn: () => copyText(nsec) }, { label: 'Close', primary: true }]);
  },
  'forget-identity': () => confirmModal('Forget identity on this device?',
    'Your apps stay live on the network — but you\'ll need your nsec (or the same wallet re-derivation) to update them. Export it first!',
    'Forget', () => forgetIdentity(), true),
  'export-backup': () => exportBackup(),
  'import': () => go('#/settings'),
  'clear-cache': () => confirmModal('Clear network cache?',
    'Removes all cached events from this browser. Your identity and pins are kept. The store re-downloads from relays on next load.',
    'Clear', async () => { await Store.evClear(); S.apps.clear(); S.reviews.clear(); S.likes.clear(); S.seenEvents.clear(); toast('Cache cleared'); render(); }, true),
  'factory-reset': () => confirmModal('Factory reset?',
    'Erases everything Lidex stored in this browser: identity, pins, cache, relays. Your published apps remain on the network (recoverable with your nsec).',
    'Erase everything', async () => {
      await Store.evClear();
      if (Store.mode === 'ls') { try { Object.keys(localStorage).filter(k => k.startsWith('lidex:')).forEach(k => localStorage.removeItem(k)); } catch (e) {} }
      else { await Store.kvDel('prefs'); await Store.kvDel('identity'); await Store.kvDel('myEvents'); }
      location.reload();
    }, true),
  'clear-search': () => { const i = $('#topsearch'); if (i) i.value = ''; go('#/'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
/* star selector (event delegation for dynamic content) */
document.addEventListener('click', e => {
  const st = e.target.closest('#starselect span[data-star]');
  if (!st) return;
  const wrap = st.parentElement;
  const val = Number(st.dataset.star);
  FORM._starVal = val;
  wrap.querySelectorAll('span[data-star]').forEach(s => s.classList.toggle('on', Number(s.dataset.star) <= val));
});

/* ---------------- top search wiring ---------------- */
let _searchTimer = null;
document.addEventListener('input', e => {
  if (e.target.id !== 'topsearch') return;
  const v = e.target.value;
  const clear = e.target.parentElement.querySelector('.s-clear');
  if (clear) clear.style.display = v ? 'block' : 'none';
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    if (!v.trim()) { if (S.route.name === 'search') go('#/'); return; }
    const target = '#/search?q=' + encodeURIComponent(v.trim());
    if (location.hash === target) return;
    location.hash = target;
  }, 240);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'topsearch') {
    clearTimeout(_searchTimer);
    const v = e.target.value.trim();
    if (v) location.hash = '#/search?q=' + encodeURIComponent(v);
  }
  if (e.key === 'Escape') {
    const ov = $('.overlay');
    if (ov) ov.remove();
  }
});

/* ============================ boot ============================ */
(async function boot() {
  await Store.init();
  S.storageMode = Store.mode;
  await loadPrefs();

  /* replay cached events instantly (offline-first) */
  const cached = await Store.evAll();
  const sorted = cached.sort((a, b) => a.created_at - b.created_at);
  for (const ev of sorted) handleEvent(ev, { persist: false });
  S.seenEvents = new Set(sorted.map(e => e.id));

  render();
  S.bootDone = true;

  /* connect to the network */
  try { RelayPool.init(S.relays); } catch (e) {}
  startSync();
  if (S.identity) syncMyEvents();

  /* banner refresh + periodic status */
  setTimeout(() => render(), 13000);          /* re-evaluate banners after relay attempts */
  setInterval(() => dirtyStatus(), 12000);

  /* keep cached verification fresh */
  Verify.enqueueAll();
})();
</script>
</body>
</html>
