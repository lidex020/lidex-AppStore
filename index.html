<style>
:root{
  --bg:#060a08; --bg2:#0a0f0c; --surface:#0d1410; --surface2:#111a14; --surface3:#17231b;
  --border:#1c2a21; --border2:#27392d;
  --text:#eaf2ec; --muted:#94a89b; --faint:#5d7264;
  --accent:#00c56d; --accent2:#00e49a; --grad:linear-gradient(135deg,#00e08a 0%,#00a55c 100%);
  --success:#34d399; --warn:#fbbf24; --danger:#f87171; --star:#ffc83d;
  --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --topbar-h:64px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:rgba(0,197,109,.35)}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%}
.brandmark{border:1px solid rgba(0,197,109,.35);box-shadow:0 0 14px rgba(0,197,109,.25)}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#20302a;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:50;height:var(--topbar-h);display:flex;align-items:center;gap:16px;
  padding:0 20px;background:rgba(6,10,8,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.logo img{display:block;border-radius:9px}
.logo .word{font-size:21px;font-weight:800;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo .word small{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--faint);-webkit-text-fill-color:var(--faint);display:block;margin-top:-3px}
.searchwrap{flex:1;max-width:560px;position:relative;margin:0 auto}
.searchwrap input{width:100%;height:42px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);
  color:var(--text);padding:0 44px 0 42px;font-size:14px;outline:none;transition:border .15s}
.searchwrap input:focus{border-color:var(--accent)}
.searchwrap .s-ico{position:absolute;left:14px;top:11px;color:var(--faint)}
.searchwrap .s-clear{position:absolute;right:8px;top:6px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:6px 8px;border-radius:50%;display:none}
.searchwrap .s-clear:hover{color:var(--text)}
.navlinks{display:flex;align-items:center;gap:4px;flex-shrink:0}
.navlink{padding:8px 13px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.navlink:hover{color:var(--text);background:var(--surface2);text-decoration:none}
.navlink.active{color:var(--text);background:var(--surface3)}
.main{max-width:1240px;margin:0 auto;padding:26px 22px 110px}
.bottomnav{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-weight:650;
  border-radius:12px;padding:10px 18px;font-size:14px;transition:transform .08s,filter .15s,background .15s;white-space:nowrap;text-decoration:none!important}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--grad);color:#fff}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface3)}
.btn-danger{background:rgba(248,113,113,.12);color:var(--danger);border:1px solid rgba(248,113,113,.3)}
.btn-danger:hover{background:rgba(248,113,113,.2)}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn-lg{padding:13px 26px;font-size:15.5px;border-radius:14px}
.btn-icon{padding:9px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--border2)}
.chip.active{background:rgba(0,197,109,.14);border-color:var(--accent);color:#7fe9b4}
.chip .x{opacity:.6;font-size:11px}

/* ---------- badges & bits ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em}
.badge svg{flex-shrink:0}
.b-dir{background:rgba(0,152,184,.12);color:#5fd9e8;border:1px solid rgba(0,152,184,.28)}
.b-ver{background:rgba(52,211,153,.12);color:#6ee7b7;border:1px solid rgba(52,211,153,.25)}
.b-unver{background:rgba(251,191,36,.12);color:#fcd34d;border:1px solid rgba(251,191,36,.25)}
.b-off{background:var(--surface3);color:var(--muted);border:1px solid var(--border)}
.mono{font-family:var(--mono);font-size:.92em}
.trunc{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
.avatar{border-radius:50%;flex-shrink:0;background:var(--surface3)}
.stars{display:inline-flex;align-items:center;gap:1px;color:var(--star)}
.ratingline{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.on{background:var(--success);box-shadow:0 0 8px rgba(52,211,153,.7)}
.dot.mid{background:var(--warn);box-shadow:0 0 8px rgba(251,191,36,.5)}
.kbd{font-family:var(--mono);font-size:11px;background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:1px 6px}

/* ---------- banners ---------- */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px 16px;margin-bottom:20px;font-size:13.5px;border:1px solid}
.banner .b-body{flex:1}
.banner .b-title{font-weight:700;margin-bottom:2px}
.banner.warn{background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.3);color:#fde68a}
.banner.info{background:rgba(0,152,184,.07);border-color:rgba(0,152,184,.28);color:#a9e9ef}
.banner.ok{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.3);color:#a7f3d0}
.banner .btn{margin-top:8px}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:24px;padding:46px 44px 42px;overflow:hidden;margin-bottom:34px;
  background:radial-gradient(1200px 500px at 85% -10%,rgba(0,197,109,.20),transparent 60%),
             radial-gradient(900px 420px at -5% 110%,rgba(0,152,184,.13),transparent 55%),
             linear-gradient(180deg,#0c1510,#090f0b);border:1px solid var(--border)}
.hero h1{font-size:clamp(26px,4.2vw,44px);font-weight:800;letter-spacing:-1.2px;line-height:1.12;max-width:640px}
.hero h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:16px;max-width:560px;margin:14px 0 24px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .stats{display:flex;gap:26px;margin-top:30px;flex-wrap:wrap}
.hero .stat b{font-size:20px;display:block}
.hero .stat span{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.statrow{display:flex;gap:28px;flex-wrap:wrap}
.statrow .stat b{font-size:21px;display:block;letter-spacing:-.4px}
.statrow .stat span{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.hero .glyph{position:absolute;right:-46px;top:-52px;width:380px;height:380px;opacity:.5;pointer-events:none;-webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent 98%);mask-image:radial-gradient(closest-side,#000 55%,transparent 98%)}

/* ---------- sections & cards ---------- */
.section{margin-bottom:36px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.sechead h2{font-size:20px;font-weight:750;letter-spacing:-.3px}
.sechead .seeall{font-size:13px;font-weight:650;color:var(--muted);cursor:pointer}
.sechead .seeall:hover{color:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}

.opt-card p{font-size:12.5px;color:var(--muted);margin-top:2px}

.toast{display:flex;align-items:center;gap:10px;background:#14211a;border:1px solid var(--border2);color:var(--text);padding:11px 18px;
  border-radius:13px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);animation:tin .25s cubic-bezier(.2,1.2,.4,1);max-width:min(92vw,480px)}
.toast.ok{border-color:rgba(52,211,153,.4)}
.toast.err{border-color:rgba(248,113,113,.5)}
@keyframes tin{from{transform:translateY(14px);opacity:0}}
.toastout{animation:tout .3s forwards}
@keyframes tout{to{transform:translateY(10px);opacity:0}}

/* ---------- about page ---------- */
.steps{counter-reset:step}
.step{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid var(--border)}
.step:last-child{border:none}
.step .n{counter-increment:step;width:38px;height:38px;border-radius:12px;flex-shrink:0;background:var(--grad);color:#fff;font-weight:800;

.step .n::before{content:counter(step)}

.step p{color:var(--muted);font-size:13.5px;margin-top:4px}

.footer{border-top:1px solid var(--border);margin-top:60px;padding:34px 22px;text-align:center;color:var(--faint);font-size:12.5px}

  .bnav{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10px;font-weight:700;cursor:pointer;padding:6px 12px;border-radius:12px}

  .shots img{height:190px}
}

    if (/^https?:\/\//.test(p)) {

}
function fmtAgo(ts) {
  if (!ts) return '—';
  const d = Date.now() / 1000 - ts;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  if (d < 86400 * 30) return Math.floor(d / 86400) + 'd ago';

  const btns = (actions || []).map((a, i) =>
    '<button class="btn ' + (a.primary ? 'btn-primary' : a.danger ? 'btn-danger' : 'btn-ghost') + '" data-mi="' + i + '">' + esc(a.label) + '</button>').join('');
  ov.innerHTML = '<div class="modal" style="' + (opts.wide ? 'max-width:680px' : '') + '">' +

  const close = () => { ov.remove(); if (opts.onClose) opts.onClose(); };

/* ============================ storage adapter ============================ */
const Store = {
  mode: 'mem', _idb: null, _lsOk: false, _mem: new Map(),
  async init() {
    /* 1. IndexedDB */
    try {
      this._idb = await new Promise((res, rej) => {
        const rq = indexedDB.open('lidex-store', 1);
        rq.onupgradeneeded = () => {
          const db = rq.result;
          if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
          if (!db.objectStoreNames.contains('events')) db.createObjectStore('events', { keyPath: 'id' });
        };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error || new Error('idb open failed'));
        rq.onblocked = () => rej(new Error('idb blocked'));
        setTimeout(() => rej(new Error('idb timeout')), 2500);
      });
      this.mode = 'idb';
      return;
    } catch (e) { /* fall through */ }
    /* 2. localStorage */
    try {
      localStorage.setItem('lidex:probe', '1');
      localStorage.removeItem('lidex:probe');
      this._lsOk = true;
      this.mode = 'ls';
      return;
    } catch (e) { /* fall through */ }
    /* 3. memory (ephemeral) */
    this.mode = 'mem';
  },
  kvGet(key) {
    if (this.mode === 'idb') return new Promise(res => {
      const tx = this._idb.transaction('kv', 'readonly');
      const rq = tx.objectStore('kv').get(key);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => res(null);
    });
    if (this.mode === 'ls') { try { return Promise.resolve(JSON.parse(localStorage.getItem('lidex:kv:' + key))); } catch (e) { return Promise.resolve(null); } }
    return Promise.resolve(this._mem.get('kv:' + key) || null);
  },
  kvSet(key, val) {
    if (this.mode === 'idb') return new Promise(res => {
      const tx = this._idb.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    });
    if (this.mode === 'ls') { try { localStorage.setItem('lidex:kv:' + key, JSON.stringify(val)); } catch (e) {} return Promise.resolve(true); }
    this._mem.set('kv:' + key, val);
    return Promise.resolve(true);
  },
  kvDel(key) {
    if (this.mode === 'idb') return new Promise(res => {
      const tx = this._idb.transaction('kv', 'readwrite');
      tx.objectStore('kv').delete(key);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    });
    if (this.mode === 'ls') { try { localStorage.removeItem('lidex:kv:' + key); } catch (e) {} return Promise.resolve(true); }
    this._mem.delete('kv:' + key);
    return Promise.resolve(true);
  },
  evPut(ev) {
    if (this.mode === 'idb') return new Promise(res => {
      const tx = this._idb.transaction('events', 'readwrite');
      tx.objectStore('events').put(ev);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    });
    if (this.mode === 'ls') {
      try {
        let ids = JSON.parse(localStorage.getItem('lidex:evindex') || '[]');
        localStorage.setItem('lidex:ev:' + ev.id, JSON.stringify(ev));
        ids.push(ev.id);
        localStorage.setItem('lidex:evindex', JSON.stringify(ids.slice(-4000)));
      } catch (e) {}
      return Promise.resolve(true);
    }
    this._mem.set('ev:' + ev.id, ev);
    return Promise.resolve(true);
  },
  evAll() {
    if (this.mode === 'idb') return new Promise(res => {
      const tx = this._idb.transaction('events', 'readonly');
      const rq = tx.objectStore('events').getAll();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => res([]);
    });
    if (this.mode === 'ls') {
      try {
        const ids = JSON.parse(localStorage.getItem('lidex:evindex') || '[]');
        return Promise.resolve(ids.map(id => { try { return JSON.parse(localStorage.getItem('lidex:ev:' + id)); } catch (e) { return null; } }).filter(Boolean));
      } catch (e) { return Promise.resolve([]); }
    }
    return Promise.resolve(Array.from(this._mem.values()).filter(v => v && v.id && v.pubkey));
  },
  evClear() {
    if (this.mode === 'idb') return new Promise(res => {
      const tx = this._idb.transaction('events', 'readwrite');
      tx.objectStore('events').clear();
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    });
    if (this.mode === 'ls') {
      try {
        const ids = JSON.parse(localStorage.getItem('lidex:evindex') || '[]');
        ids.forEach(id => localStorage.removeItem('lidex:ev:' + id));
        localStorage.removeItem('lidex:evindex');
      } catch (e) {}
      return Promise.resolve(true);
    }
    return Promise.resolve(true);
  }
};

function getReviews(aTag) { return S.reviews.get(aTag) || new Map(); }

function removeEventById(id) {
  let changed = false;
  S.likes.forEach(m => { m.forEach((l, pk) => { if (l.ev.id === id) { m.delete(pk); changed = true; } }); });
  S.reviews.forEach(m => { m.forEach((r, pk) => { if (r.ev.id === id) { m.delete(pk); changed = true; } }); });
  if (changed) dirty();
}
function isLidexEvent(ev) {
  return (ev.tags || []).some(t => t && t[0] === 'l' && (t[1] === 'lidex' || t[1] === 'lidex-review' || t[1] === 'lidex-like'));
}
function handleEvent(ev, opts) {
  if (!ev || !ev.id || !ev.pubkey || typeof ev.kind !== 'number') return;
  if (S.seenEvents.has(ev.id)) return;
  S.seenEvents.add(ev.id);
  let keep = false;
  try {
    if (ev.kind === 30078) {
      if (!isLidexEvent(ev)) return;
      const rec = eventToAppRecord(ev);
      if (!rec) return;
      const old = S.apps.get(rec.aTag);
      if (old && old.createdAt >= rec.createdAt) return; /* keep newest version */
      rec.verify = { nostr: null, eth: null };
      S.apps.set(rec.aTag, rec);
      Verify.enqueue(rec);
      keep = true;
    } else if (ev.kind === 1) {
      if (!isLidexEvent(ev)) return;
      let c = null; try { c = JSON.parse(ev.content); } catch (e) { return; }
      if (!c || typeof c.rating !== 'number' || !c.app) return;
      const aTag = String(c.app);
      if (!S.reviews.has(aTag)) S.reviews.set(aTag, new Map());
      const m = S.reviews.get(aTag);
      const prev = m.get(ev.pubkey);
      if (prev && prev.at >= ev.created_at) return;
      m.set(ev.pubkey, { ev, rating: Math.min(5, Math.max(1, Math.round(c.rating))), text: String(c.text || '').slice(0, 1200), at: ev.created_at, verify: null });
      Verify.enqueueSocial(m.get(ev.pubkey), 'review');
      keep = true;
    } else if (ev.kind === 7) {
      if (!isLidexEvent(ev)) return;
      const aTag = ((ev.tags || []).find(t => t[0] === 'a') || [])[1];
      if (!aTag) return;
      if (!S.likes.has(aTag)) S.likes.set(aTag, new Map());
      const m = S.likes.get(aTag);
      const prev = m.get(ev.pubkey);
      if (prev && prev.at >= ev.created_at) return;
      m.set(ev.pubkey, { ev, at: ev.created_at, verify: null });
      Verify.enqueueSocial(m.get(ev.pubkey), 'like');
      keep = true;
    } else if (ev.kind === 5) {
      if (!isLidexEvent(ev)) return;
      for (const t of (ev.tags || [])) {
        if (t[0] === 'a' && t[1] && String(t[1]).startsWith('30078:')) {
          const rec = S.apps.get(t[1]);
          if (rec && rec.pubkey === ev.pubkey) { rec.deleted = true; rec.deletedAt = ev.created_at; dirty(); }
        } else if (t[0] === 'e' && t[1]) {
          removeEventById(t[1]);
        }
      }
      keep = true;
    }
  } catch (e) { /* malformed event — ignore */ }
  if (keep && opts && opts.persist) Store.evPut(ev);
  if (keep) dirty();
}

/* ---------------- background signature verification ---------------- */
const Verify = {
  queue: [], socialQueue: [], running: false, needRender: false,
  enqueue(rec) { this.queue.push(rec); this.run(); },
  enqueueAll() { S.apps.forEach(r => { if (r.verify && r.verify.nostr === null) this.queue.push(r); }); this.run(); },
  enqueueSocial(item, kind) { item._verifyKind = kind; this.socialQueue.push(item); this.run(); },
  run() {
    if (this.running) return;
    this.running = true;
    const self = this;
    const step = function () {
      const apps = self.queue.splice(0, 5);
      const social = apps.length ? [] : self.socialQueue.splice(0, 12);
      if (!apps.length && !social.length) {
        self.running = false;
        if (self.needRender) { self.needRender = false; render(); }
        return;
      }
      for (const rec of apps) {
        try {
          rec.verify.nostr = verifyNostrEvent(rec.raw);
          if (!rec.deleted && rec.eth && rec.eth.sig) {
            const content = JSON.parse(rec.raw.content);
            const recovered = recoverManifestSigner(content);
            rec.verify.eth = !!recovered && recovered.toLowerCase() === String(content.eth.address || '').toLowerCase();
          } else rec.verify.eth = null;
        } catch (e) { rec.verify.nostr = false; rec.verify.eth = false; }
      }
      for (const item of social) {
        try { item.verify = verifyNostrEvent(item.ev); } catch (e) { item.verify = false; }
      }
      self.needRender = true;
      setTimeout(step, 25);
    };
    step();
  }
};

function allApps(opts) {

  const out = [];
  DIRECTORY.forEach(d => { if (!S.hidden.includes('dir:' + d.slug)) out.push(dirUnified(d)); });
  S.apps.forEach(rec => {

function findApp(id) {
  if (!id) return null;
  if (id.startsWith('dir:')) {
    const d = DIRECTORY.find(x => 'dir:' + x.slug === id);
    return d ? dirUnified(d) : null;
  }
  const rec = S.apps.get(id);

function appScore(u) {
  const likes = countLikes(u.id), rs = reviewStats(u.id);
  const ageDays = Math.max(0, (Date.now() / 1000 - (u.updatedAt || u.createdAt || 0)) / 86400);
  const recency = Math.max(0.35, 1 - ageDays / 60);
  let score = (likes * 3 + rs.count * 2 + rs.avg * rs.count) * recency;
  if (u.source === 'directory') score += 1.5;
  if (u.record && u.record.verify.nostr === true) score += 1;
  return score;
}
function searchApps(q) {
  q = String(q || '').trim().toLowerCase();
  if (!q) return [];
  const terms = q.split(/\s+/);
  return allApps().map(u => {
    const hay = (u.name + ' ' + u.tagline + ' ' + u.developerName + ' ' + u.tags.join(' ') + ' ' + catLabel(u.category) + ' ' + u.chains.join(' ') + ' ' + u.description).toLowerCase();
    let score = 0;
    for (const t of terms) {
      if (u.name.toLowerCase().startsWith(t)) score += 12;
      else if (u.name.toLowerCase().includes(t)) score += 8;
      else if (hay.includes(t)) score += 3;
      else return null;
    }
    return { u, score };
  }).filter(Boolean).sort((a, b) => b.score - a.score).map(x => x.u);
}

/* ---------------- relay pool ---------------- */
const RelayPool = {
  socks: new Map(),       // url → {ws, status, attempts, backoff}
  subs: new Map(),        // name → {id, filter, onEvent, onEose, eose:Set}
  pending: new Map(),     // eventId → {resolve, accepted:[], rejected:[], remaining:Set}
  everConnected: false,
  init(urls) { urls.forEach(u => this.connect(u, true)); this.refreshCount(); },
  connect(url, initial) {
    if (this.socks.has(url) && ['connecting', 'open'].includes(this.socks.get(url).status)) return;
    const s = { ws: null, status: 'connecting', attempts: initial ? 0 : 1, backoff: initial ? 3000 : 6000 };
    this.socks.set(url, s);
    dirtyStatus();
    try {
      s.ws = new WebSocket(url);
    } catch (e) { s.status = 'failed'; dirtyStatus(); return; }
    s.ws.onopen = () => {
      s.status = 'open'; s.attempts = 0;
      this.everConnected = true; S.net.everConnected = true;
      /* subscribe active subs */
      this.subs.forEach(sub => this.send(url, JSON.stringify(['REQ', sub.id, sub.filter])));
      dirtyStatus();
    };
    s.ws.onmessage = (e) => {
      let f = null; try { f = JSON.parse(e.data); } catch (err) { return; }
      if (!Array.isArray(f) || !f.length) return;
      if (f[0] === 'EVENT' && f[1] && f[2]) {
        const sub = Array.from(this.subs.values()).find(x => x.id === f[1]);
        if (sub && sub.onEvent) { try { sub.onEvent(f[2]); } catch (err) {} }
      } else if (f[0] === 'EOSE' && f[1]) {
        const sub = Array.from(this.subs.values()).find(x => x.id === f[1]);
        if (sub && sub.onEose) { try { sub.onEose(url); } catch (err) {} }
      } else if (f[0] === 'OK' && f[1]) {
        const p = this.pending.get(f[1]);
        if (p) {
          p.remaining.delete(url);
          if (f[2] === true) p.accepted.push(url);
          else p.rejected.push({ url, msg: f[3] || 'rejected' });
          if (p.remaining.size === 0) { clearTimeout(p.timer); this.pending.delete(f[1]); p.resolve(p); }
        }
      } else if (f[0] === 'CLOSED' && f[1]) {
        /* relay refused the subscription */
      } else if (f[0] === 'NOTICE') {
        /* informational */
      }
    };
    s.ws.onclose = () => {
      s.status = 'closed'; dirtyStatus();
      if (s.attempts < 3) {
        s.attempts++;
        const wait = Math.min(30000, s.backoff * s.attempts);
        setTimeout(() => { if (S.relays.includes(url)) this.connect(url, false); }, wait);
      } else { s.status = 'failed'; dirtyStatus(); }
    };
    s.ws.onerror = () => { s.status = 'failed'; dirtyStatus(); };
    this.refreshCount();
  },
  send(url, str) {
    const s = this.socks.get(url);
    if (s && s.status === 'open' && s.ws.readyState === 1) { try { s.ws.send(str); return true; } catch (e) {} }
    return false;
  },
  openCount() {
    let n = 0; this.socks.forEach(s => { if (s.status === 'open') n++; }); return n;
  },
  refreshCount() { S.net.open = this.openCount(); S.net.connected = S.relays.length; },
  subscribe(name, filter, onEvent, onEose) {
    const sub = { id: 'lidex_' + name, filter, onEvent, onEose, eose: new Set() };
    this.subs.set(name, sub);
    S.relays.forEach(url => this.send(url, JSON.stringify(['REQ', sub.id, filter])));
    return sub;
  },
  resubscribeAll() {
    this.subs.forEach(sub => { sub.eose = new Set(); S.relays.forEach(url => this.send(url, JSON.stringify(['REQ', sub.id, sub.filter]))); });
  },
  closeAndResub(name, filter, onEvent, onEose) {
    const old = this.subs.get(name);
    if (old) S.relays.forEach(url => this.send(url, JSON.stringify(['CLOSE', old.id])));
    return this.subscribe(name, filter, onEvent, onEose);
  },
  publish(ev, timeoutMs) {
    return new Promise(resolve => {
      const openUrls = [];
      this.socks.forEach((s, url) => { if (s.status === 'open') openUrls.push(url); });
      const entry = {
        resolve, accepted: [], rejected: [],
        remaining: new Set(openUrls),
        timer: null
      };
      if (!openUrls.length) return resolve({ accepted: [], rejected: [], sent: 0 });
      entry.timer = setTimeout(() => {
        this.pending.delete(ev.id);
        resolve(entry);
      }, timeoutMs || 9000);

  let received = 0;
  RelayPool.closeAndResub('main', filter,
    ev => { received++; handleEvent(ev, { persist: true }); },
    () => { S.net.syncing = false; S.net.lastSync = nowSec(); dirty(); }
  );
  /* if no relay ever reaches EOSE (offline), stop showing skeletons */
  setTimeout(() => { if (S.net.syncing) { S.net.syncing = false; dirty(); } }, 20000);

  setInterval(() => {
    if (RelayPool.openCount() === 0) return;
    _lastFullSync = nowSec();

      ev => handleEvent(ev, { persist: true }),
      () => { S.net.lastSync = nowSec(); dirty(); }

  announced: [],   /* EIP-6963 discovered providers */
  active: null,

  discover() {

  _nameOf(p) {

  },
  candidates() {

/* ---------------- image pipeline ---------------- */
function fileToImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read image')); };
    img.src = url;
  });
}
function canvasToDataUrl(cv, mime, q) {
  const du = cv.toDataURL(mime, q);
  if (du.startsWith('data:image/webp') || du.startsWith('data:image/jpeg')) return du;
  return null; /* browser can't encode this type */
}
async function compressImage(file, opts) {
  const o = Object.assign({ maxW: 640, maxH: 640, budget: 20000, cover: false, sizes: null }, opts || {});
  const img = await fileToImage(file);
  const mk = (w, h) => {
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w)); cv.height = Math.max(1, Math.round(h));
    const cx = cv.getContext('2d');
    if (o.cover) {
      const scale = Math.max(cv.width / img.width, cv.height / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      cx.drawImage(img, (cv.width - dw) / 2, (cv.height - dh) / 2, dw, dh);
    } else {
      const scale = Math.min(cv.width / img.width, cv.height / img.height, 1);
      const dw = img.width * scale, dh = img.height * scale;
      cx.fillStyle = '#060a08';
      cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(img, (cv.width - dw) / 2, (cv.height - dh) / 2, dw, dh);
    }
    return cv;
  };

  if (h > o.maxH) { h = o.maxH; w = h * (img.width / img.height); }
  const widthLadder = o.sizes || [1, 0.82, 0.68, 0.55, 0.45];
  for (const f of widthLadder) {
    const cv = mk(w * f, h * f);
    for (const q of [0.78, 0.6, 0.45]) {
      let du = canvasToDataUrl(cv, 'image/webp', q);
      if (!du) du = canvasToDataUrl(cv, 'image/jpeg', q);
      if (du && du.length * 0.75 <= o.budget) return du;
    }
  }
  const cv = mk(w * widthLadder[widthLadder.length - 1], h * widthLadder[widthLadder.length - 1]);
  let du = canvasToDataUrl(cv, 'image/webp', 0.4) || canvasToDataUrl(cv, 'image/jpeg', 0.4);
  return du || '';
}
async function processIconFile(file) { return compressImage(file, { maxW: 128, maxH: 128, budget: 17000, cover: true }); }

/* ---------------- form validation ---------------- */
function validateForm(v, editing) {
  const errs = [];
  if (!v.name || v.name.length < 2 || v.name.length > 60) errs.push('App name must be 2–60 characters.');
  if (!v.tagline || v.tagline.length < 4 || v.tagline.length > 140) errs.push('Tagline must be 4–140 characters.');
  if (!CATEGORIES.some(c => c.slug === v.category)) errs.push('Pick a category.');
  if (!/^https:\/\/.+\..+/i.test(v.appUrl || '')) errs.push('App URL must be a valid https:// link.');
  if (v.links.website && !/^https:\/\/.+\..+/i.test(v.links.website)) errs.push('Website must be an https:// link.');
  if (v.links.github && !/^https:\/\/(www\.)?github\.com\//i.test(v.links.github)) errs.push('GitHub link must start with https://github.com/');
  if (v.links.twitter) {
    const t = v.links.twitter.replace(/^@/, '');
    if (!/^https:\/\/(www\.)?(x|twitter)\.com\//i.test(v.links.twitter) && !/^[A-Za-z0-9_]{2,15}$/.test(t)) errs.push('X/Twitter must be a link or a @handle.');
  }
  if (!v.version || v.version.length > 24) errs.push('Version is required (e.g. 1.0.0).');
  if (!v.description || v.description.length < 30) errs.push('Description must be at least 30 characters.');
  if (v.description.length > 4000) errs.push('Description too long (max 4000).');
  if (v.tags.length > 5) errs.push('Max 5 tags.');
  if (v.chains.length < 1) errs.push('Pick at least one chain.');
  if (!v.icon) errs.push('Choose an icon (emoji tile or upload).');
  if (!/^\d+(\.\d+){0,3}(-[a-z0-9.]+)?$/i.test(v.version)) errs.push('Version should look like 1.0.0');
  return errs;
}

/* ---------------- publish / update ---------------- */
async function buildContentFromForm(v, existingRec, changelog) {
  const now = nowSec();
  const prev = existingRec ? existingRec.manifest : null;
  const history = prev ? (prev.history || []) : [];
  if (prev) history.push({ version: prev.version, at: prev.updatedAt || now, changelog: String(changelog || '').slice(0, 600) });
  const core = buildManifestCore({
    name: v.name, tagline: v.tagline, description: v.description,
    category: v.category, tags: v.tags, chains: v.chains,
    version: v.version, appUrl: v.appUrl,
    links: v.links, icon: v.icon, screenshots: v.screenshots,
    developer: { name: v.developerName || 'Anonymous', address: (v.developerAddress || '').toLowerCase() },
    createdAt: prev ? prev.createdAt : now,
    updatedAt: now,
    history: history.slice(-30)
  });
  return { core, now };
}
async function doPublish(v, existingRec, onStep) {
  const ident = S.identity || await ensureIdentity();
  if (!ident) throw new Error('Publisher identity required.');
  onStep = onStep || function () {};

  onStep('wallet', 'active');
  /* resolve wallet (if any) BEFORE building the manifest so the developer
     address is part of the signed payload — one signature, one prompt */
  let walletAddr = '';
  if (S.wallet && S.wallet.address) walletAddr = S.wallet.address;
  else if (Wallet.hasAnyWallet()) { try { walletAddr = await Wallet.connect(); } catch (e) { walletAddr = ''; } }
  const vIn = Object.assign({}, v, { developerAddress: walletAddr || v.developerAddress });
  const { core } = await buildContentFromForm(vIn, existingRec, v.changelog);
  const content = Object.assign({}, core);
  if (walletAddr) {
    const msgHash = manifestHashHex(core);
    toast('Sign the app manifest in your wallet (free — no transaction)', 'ok');
    const sig = await Wallet.personalSign('0x' + msgHash, walletAddr);
    content.eth = { address: walletAddr.toLowerCase(), msgHash, sig };
  }
  onStep('wallet', 'done');

  onStep('nostr', 'active');
  const d = existingRec ? existingRec.d : slugify(v.name) + '-' + randomHex(2);
  const tags = [
    ['d', d], ['l', 'lidex'], ['alt', 'Lidex app listing: ' + core.name],
    ['name', core.name], ['category', core.category], ['client', 'lidex']
  ];
  core.tags.forEach(t => tags.push(['t', String(t).toLowerCase()]));
  if (content.eth) tags.push(['addr', content.eth.address]);
  const ev = {
    pubkey: ident.pubkey, created_at: nowSec(), kind: LIDEX_KIND_APP, tags,
    content: JSON.stringify(content)
  };
  signNostrEvent(ident.sk, ev);
  if (ev.content.length > CONTENT_MAX) {
    throw new Error('App package is ' + fmtBytes(ev.content.length) + ' — relays accept up to ~64 KB. Remove a screenshot or use smaller images.');
  }
  onStep('nostr', 'done');

  onStep('relay', 'active');
  handleEvent(ev, { persist: true });
  S.myEvents.push(ev.id);
  await Store.kvSet('myEvents', S.myEvents);
  const pub = await RelayPool.publish(ev, 9000);
  onStep('relay', 'done');
  return { ev, pub, aTag: '30078:' + ident.pubkey + ':' + d };
}
async function doUnpublish(rec) {
  const ident = S.identity;
  if (!ident || ident.pubkey !== rec.pubkey) throw new Error('Only the publisher can unpublish this app.');
  const tomb = {
    pubkey: ident.pubkey, created_at: nowSec(), kind: LIDEX_KIND_APP,
    tags: [['d', rec.d], ['l', 'lidex'], ['alt', 'Lidex listing removed'], ['client', 'lidex']],
    content: JSON.stringify({ spec: LIDEX_SPEC, name: rec.manifest.name, deleted: true, deletedAt: nowSec() })
  };
  signNostrEvent(ident.sk, tomb);
  const del = {
    pubkey: ident.pubkey, created_at: nowSec(), kind: LIDEX_KIND_DELETE,
    tags: [['a', rec.aTag], ['e', rec.eventId], ['l', 'lidex'], ['client', 'lidex']],
    content: 'Lidex: unpublish ' + rec.manifest.name
  };
  signNostrEvent(ident.sk, del);
  handleEvent(tomb, { persist: true });
  handleEvent(del, { persist: true });
  const r1 = await RelayPool.publish(tomb, 7000);
  await RelayPool.publish(del, 5000);
  return r1;
}

/* ---------------- likes & reviews ---------------- */
async function toggleLike(u) {
  const ident = S.identity || await ensureIdentity();
  if (!ident) return;
  if (!u.record) { toast('Likes are for network-published apps', 'err'); return; }
  const existing = myLike(u.id);
  if (existing) {
    const del = {
      pubkey: ident.pubkey, created_at: nowSec(), kind: LIDEX_KIND_DELETE,
      tags: [['e', existing.ev.id], ['l', 'lidex-like'], ['client', 'lidex']],
      content: 'Lidex: unlike'
    };
    signNostrEvent(ident.sk, del);
    handleEvent(del, { persist: true });
    await RelayPool.publish(del, 6000);
    toast('Like removed');
  } else {
    const ev = {
      pubkey: ident.pubkey, created_at: nowSec(), kind: LIDEX_KIND_LIKE,
      tags: [['a', u.id], ['e', u.record.eventId], ['p', u.record.pubkey], ['l', 'lidex-like'], ['client', 'lidex']],
      content: '+'
    };
    signNostrEvent(ident.sk, ev);
    handleEvent(ev, { persist: true });
    await RelayPool.publish(ev, 6000);
    toast('You liked ' + u.name, 'ok');
  }
  dirty();
}
async function submitReview(u, rating, text) {
  const ident = S.identity || await ensureIdentity();
  if (!ident) return false;
  if (!u.record) { toast('Reviews are for network-published apps', 'err'); return false; }
  if (!rating) { toast('Pick a star rating first', 'err'); return false; }
  const existing = myReview(u.id);
  if (existing) {
    const del = {
      pubkey: ident.pubkey, created_at: nowSec(), kind: LIDEX_KIND_DELETE,
      tags: [['e', existing.ev.id], ['l', 'lidex-review'], ['client', 'lidex']],
      content: 'Lidex: replace review'
    };
    signNostrEvent(ident.sk, del);
    handleEvent(del, { persist: true });
    await RelayPool.publish(del, 6000);
  }
  const ev = {
    pubkey: ident.pubkey, created_at: nowSec(), kind: LIDEX_KIND_REVIEW,
    tags: [['a', u.id], ['p', u.record.pubkey], ['l', 'lidex-review'], ['client', 'lidex'],
           ['alt', 'Lidex review of ' + u.name + ': ' + rating + ' stars']],
    content: JSON.stringify({ app: u.id, rating, text: String(text || '').slice(0, 1200) })
  };
  signNostrEvent(ident.sk, ev);
  handleEvent(ev, { persist: true });
  const r = await RelayPool.publish(ev, 6000);
  toast(r.accepted.length ? 'Review published' : 'Review saved locally (no relay reachable)', 'ok');
  dirty();
  return true;
}

/* ---------------- import / export ---------------- */
function exportApp(u) {
  if (!u.record) { toast('Directory listings are built-in', 'err'); return; }
  const payload = JSON.stringify({ lidex: 'app-export@1', event: u.record.raw }, null, 2);
  const fname = slugify(u.name) + '.lidex.json';
  if (!download(fname, payload)) {
    showModal('Export ' + esc(u.name), '<p class="sub">Download is blocked here — copy the signed app file:</p>' +
      '<textarea readonly style="min-height:180px;font-size:11px;font-family:var(--mono)">' + esc(payload) + '</textarea>',
      [{ label: 'Copy', fn: () => copyText(payload) }, { label: 'Close', primary: true }]);
    return;
  }
  toast('Exported ' + fname, 'ok');
}
async function importLidexText(text) {
  const obj = JSON.parse(text);
  const ev = obj.event || obj;
  if (!ev || !ev.id || !ev.sig) throw new Error('Not a Lidex app file.');
  if (!verifyNostrEvent(ev)) throw new Error('Signature verification failed — this file has been tampered with.');
  handleEvent(ev, { persist: true });
  const rec = S.apps.get('30078:' + ev.pubkey + ':' + ((ev.tags.find(t => t[0] === 'd') || [])[1]));
  return rec;
}
function exportBackup() {
  const events = [];
  S.apps.forEach(r => { if (!r.deleted) events.push(r.raw); });
  const payload = JSON.stringify({
    lidex: 'backup@1', exportedAt: new Date().toISOString(),
    prefs: { pins: S.pins, hidden: S.hidden, relays: S.relays },
    events
  }, null, 2);
  if (!download('lidex-backup-' + Date.now() + '.json', payload)) {
    showModal('Backup', '<textarea readonly style="min-height:200px;font-size:11px;font-family:var(--mono)">' + esc(payload) + '</textarea>',
      [{ label: 'Copy', fn: () => copyText(payload) }, { label: 'Close', primary: true }]);
    return;
  }
  toast('Backup downloaded', 'ok');
}

function netPillHtml() {
  const open = S.net.open, total = S.relays.length;
  const cls = open > 0 ? 'on' : (RelayPool.everConnected ? 'mid' : '');
  return '<span class="chip" data-action="relays" title="Relay status" style="gap:7px">' +
    '<span class="dot ' + cls + '"></span>' + open + '/' + total + ' relays</span>';
}
function walletBtnHtml() {
  if (S.wallet && S.wallet.address) {
    return '<button class="btn btn-ghost btn-sm" data-action="wallet-menu" style="gap:9px" title="' + esc(S.wallet.name || 'Wallet') + '">' +
      '<img class="avatar" src="' + avatarSvg(S.wallet.address, 22) + '" width="22" height="22">' +
      '<span class="mono">' + shortKey(S.wallet.address, 4) + '</span>' + icon('chevR', 13) + '</button>';
  }
  return '<button class="btn btn-primary btn-sm" data-action="connect-wallet">' + icon('wallet', 15) + ' Connect wallet</button>';
}
function topbarHtml() {
  const q = S.route.name === 'search' ? S.route.q : '';
  return '<div class="topbar">' +
    '<div class="logo" data-action="go" data-href="#/">' +
      '<img class="brandmark" src="' + LOGO_MARK + '" width="30" height="30" alt="">' +
      '<div class="word">Lidex<small>WEB3 APP STORE</small></div>' +
    '</div>' +
    '<div class="searchwrap">' + icon('search', 17, 2.4).replace('<svg', '<svg class="s-ico"') +
      '<input id="topsearch" type="text" placeholder="Search apps, games, DeFi, protocols…" value="' + esc(q) + '" autocomplete="off" spellcheck="false">' +
      '<button class="s-clear" data-action="clear-search">' + icon('x', 14) + '</button>' +
    '</div>' +
    '<nav class="navlinks">' +
      '<a class="navlink ' + (S.route.name === 'discover' ? 'active' : '') + '" href="#/">Discover</a>' +
      '<a class="navlink ' + (S.route.name === 'my' ? 'active' : '') + '" href="#/my">My Apps</a>' +
      '<a class="navlink ' + (S.route.name === 'dev' ? 'active' : '') + '" href="#/dev">Developer</a>' +
      '<a class="navlink ' + (S.route.name === 'about' ? 'active' : '') + '" href="#/about">About</a>' +
      '<a class="navlink ' + (S.route.name === 'settings' ? 'active' : '') + '" href="#/settings">' + icon('gear', 15) + '</a>' +
    '</nav>' +
    '<span id="netpill">' + netPillHtml() + '</span>' +
    walletBtnHtml() +
  '</div>';
}
function bottomNavHtml() {
  const r = S.route.name;
  const item = (href, ic, label, act) => '<a class="bnav ' + ((r === act) ? 'active' : '') + '" href="' + href + '">' + icon(ic, 21) + '<span>' + label + '</span></a>';
  return '<nav class="bottomnav">' +
    item('#/', 'grid', 'Discover', 'discover') +
    item('#/publish', 'plus', 'Publish', 'publish') +
    item('#/my', 'bookmark', 'My Apps', 'my') +
    item('#/dev', 'user', 'Developer', 'dev') +
    '</nav>';
}
function bannersHtml() {
  let out = '';
  if (Store.mode === 'mem') {
    out += '<div class="banner warn">' + icon('warn', 19) + '<div class="b-body"><div class="b-title">Ephemeral preview storage</div>' +
      'This embedded preview cannot persist data. Everything works, but state resets on reload. ' +
      'Download this file (or host it anywhere static) for full persistence — the app is 100% self-contained.' +
      '</div></div>';
  }
  if (S.bootDone && !RelayPool.everConnected) {
    out += '<div class="banner warn">' + icon('signal', 19) + '<div class="b-body"><div class="b-title">Relays unreachable</div>' +
      'Can\'t reach the Nostr network from here, so you\'re seeing local + editorial data only. ' +
      'Open this file in a normal browser tab with internet to sync the live store.' +
      '<br><button class="btn btn-ghost btn-sm" data-action="retry-relays" style="margin-top:8px">' + icon('refresh', 13) + ' Retry</button></div></div>';
  }
  return out;
}
function footerHtml() {
  return '<footer class="footer"><b>Lidex</b> — the permissionless web3 app store. No backend. No database. No gatekeepers.<br>' +
    'Listings are signed Nostr events on public relays, verified in your browser. This single HTML file is the entire product — host it anywhere.' +
    '<br><a href="#/about">How it works</a> · <a href="#/settings">Settings</a> · Built for the open web</footer>';
}

/* ---------------- app cards ---------------- */
function trustBadgeHtml(u) {
  if (u.source === 'directory') return '<span class="badge b-dir">' + icon('info', 10) + ' Directory</span>';
  const v = u.record.verify || {};
  if (v.nostr === true) return '<span class="badge b-ver">' + icon('check', 10) + ' Signed</span>';
  if (v.nostr === false) return '<span class="badge b-unver">' + icon('shieldx', 10) + ' Bad sig</span>';
  return '<span class="badge b-off">' + icon('shieldq', 10) + ' Verifying…</span>';
}
function appCard(u) {
  const rs = reviewStats(u.id);
  const rating = rs.count ? '<span class="stars">' + iconFill('star', 12) + '</span> ' + rs.avg.toFixed(1) : '';
  const likes = countLikes(u.id);
  return '<div class="appcard" data-action="open-app-card" data-id="' + esc(u.id) + '">' +
    '<div class="icon"><img src="' + esc(u.icon) + '" alt="" loading="lazy"></div>' +
    '<div class="meta">' +
      '<div class="name"><span>' + esc(u.name) + '</span>' + trustBadgeHtml(u) + '</div>' +
      '<div class="dev">' + esc(u.developerName) + '</div>' +
      '<div class="foot"><span class="cat">' + esc(catLabel(u.category)) + '</span>' +
        (rating ? '<span>· ' + rating + '</span>' : '') +
        (likes ? '<span>· ' + iconFill('heart', 11) + ' ' + likes + '</span>' : '') +
      '</div>' +
    '</div></div>';
}
function sectionHtml(title, apps, seeAllHref, opts) {
  if (!apps.length && !(opts && opts.skeleton)) return '';
  let inner;
  if (opts && opts.skeleton) inner = Array.from({ length: 5 }, () => '<div class="skel"></div>').join('');
  else inner = apps.map(appCard).join('');
  return '<div class="section"><div class="sechead"><h2>' + title + '</h2>' +
    (seeAllHref ? '<a class="seeall" href="' + seeAllHref + '">See all ' + icon('chevR', 13) + '</a>' : '') +
    '</div><div class="grid">' + inner + '</div></div>';
}

/* ---------------- discover ---------------- */
function discoverView() {
  const all = allApps();
  const netApps = all.filter(u => u.source === 'network');
  const publishers = new Set(netApps.map(u => u.npub)).size;
  const trending = all.slice().sort((a, b) => appScore(b) - appScore(a)).slice(0, 8);
  const newest = netApps.filter(u => u.updatedAt).sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 8);
  const topRated = netApps.map(u => ({ u, r: reviewStats(u.id) })).filter(x => x.r.count > 0)
    .sort((a, b) => (b.r.avg - a.r.avg) || (b.r.count - a.r.count)).slice(0, 8).map(x => x.u);

  const recent = S.viewed.map(findApp).filter(u => u && !u.deleted);

  let out = '<div class="hero">' +
    '<img class="glyph" src="' + LOGO_GLYPH + '" alt="">' +
    '<h1>The app store for web3 —<br><span class="grad">without the gatekeepers</span></h1>' +
    '<p>Publish, update and discover web3 apps. No approval queues, no fees, no backend. Connect a wallet to publish in seconds — your keys are your developer account.</p>' +
    '<div class="cta"><button class="btn btn-primary btn-lg" data-action="publish">' + icon('plus', 17) + ' Publish your app — free</button>' +
    '<a class="btn btn-ghost btn-lg" href="#/about">' + icon('info', 16) + ' How it works</a></div>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + (netApps.length + DIRECTORY.length) + '</b><span>apps listed</span></div>' +
      '<div class="stat"><b>' + publishers + '</b><span>independent publishers</span></div>' +
      '<div class="stat"><b>' + S.net.open + '<span style="display:inline">/</span>' + S.relays.length + '</b><span>relays connected</span></div>' +
      '<div class="stat"><b>0</b><span>fees, accounts & servers</span></div>' +
    '</div></div>';

  out += '<div class="catchips">' + CATEGORIES.map(c =>
    '<a class="chip" href="#/category/' + c.slug + '">' + esc(c.label) + '</a>').join('') + '</div>';

  if (recent.length) out += sectionHtml('Continue exploring', recent, null);

  const syncing = S.net.syncing && !RelayPool.everConnected;
  out += sectionHtml('Trending now', trending, '#/category/all');
  out += sectionHtml('From the network', syncing && !netApps.length ? [] : netApps.sort((a, b) => appScore(b) - appScore(a)).slice(0, 12), '#/category/network',
    syncing && !netApps.length ? { skeleton: true } : {});
  if (topRated.length) out += sectionHtml('Top rated', topRated, '#/category/network');
  if (newest.length) out += sectionHtml('New releases', newest, '#/category/network');
  out += sectionHtml('Editor\'s directory', all.filter(u => u.source === 'directory'), '#/category/directory');
  if (!syncing && netApps.length === 0 && Store.mode !== 'mem' && RelayPool.everConnected) {
    out += '<div class="empty"><div class="big">🛰️</div><h3>The network feed is empty — for now</h3>' +
      '<p>Be the very first to publish an app to the Lidex network. It takes about a minute.</p>' +
      '<button class="btn btn-primary" data-action="publish">' + icon('plus', 15) + ' Publish the first app</button></div>';
  }
  return out;
}

/* ---------------- search ---------------- */
function searchView() {
  const q = S.route.q || '';
  const res = q ? searchApps(q) : [];
  let out = '<div class="section"><div class="sechead"><h2>' + (q ? 'Results for "' + esc(q) + '"' : 'Search') + '</h2>' +
    '<span style="color:var(--faint);font-size:13px">' + res.length + ' app' + (res.length === 1 ? '' : 's') + '</span></div>';
  if (!q) {
    out += '<div class="empty"><div class="big">🔎</div><h3>Search Lidex</h3><p>Find web3 apps by name, category, chain or tag — across the live network and the editorial directory.</p></div>';
  } else if (!res.length) {
    out += '<div class="empty"><div class="big">🫥</div><h3>Nothing found</h3><p>No apps match "' + esc(q) + '". You could publish it — the name is free.</p>' +
      '<button class="btn btn-primary" data-action="publish">' + icon('plus', 15) + ' Publish an app</button></div>';
  } else {
    out += '<div class="grid">' + res.map(appCard).join('') + '</div>';
  }
  return out + '</div>';
}

/* ---------------- category ---------------- */
function categoryView(slug) {
  let apps, title;
  if (slug === 'network') { apps = allApps().filter(u => u.source === 'network'); title = 'From the network'; }
  else if (slug === 'directory') { apps = allApps().filter(u => u.source === 'directory'); title = 'Editor\'s directory'; }
  else if (slug === 'all') { apps = allApps(); title = 'All apps'; }
  else { apps = allApps().filter(u => u.category === slug); title = catLabel(slug); }
  apps.sort((a, b) => appScore(b) - appScore(a));
  return '<div class="section"><div class="sechead"><h2>' + esc(title) +
    '</h2><span style="color:var(--faint);font-size:13px">' + apps.length + ' apps</span></div>' +
    '<div class="catchips">' +
      '<a class="chip ' + (slug === 'all' ? 'active' : '') + '" href="#/category/all">All</a>' +
      '<a class="chip ' + (slug === 'network' ? 'active' : '') + '" href="#/category/network">' + icon('zap', 12) + ' Network</a>' +
      '<a class="chip ' + (slug === 'directory' ? 'active' : '') + '" href="#/category/directory">' + icon('info', 12) + ' Directory</a>' +
      CATEGORIES.map(c => '<a class="chip ' + (slug === c.slug ? 'active' : '') + '" href="#/category/' + c.slug + '">' + esc(c.label) + '</a>').join('') +
    '</div>' +
    (apps.length ? '<div class="grid">' + apps.map(appCard).join('') + '</div>'
      : '<div class="empty"><div class="big">📂</div><h3>Nothing here yet</h3><p>No apps in this category right now. Publish the first one.</p></div>') +
    '</div>';
}

/* ---------------- app detail ---------------- */
function appDetailHeaderView(u) {
  const rs = reviewStats(u.id), likes = countLikes(u.id);
  const liked = !!myLike(u.id), pinned = S.pins.includes(u.id);
  const devId = u.npub ? 'npub' : '';
  return '<div class="detail-head">' +
    '<div class="icon"><img src="' + esc(u.icon) + '" alt=""></div>' +
    '<div class="info">' +
      '<h1>' + esc(u.name) + ' ' + trustBadgeHtml(u) + '</h1>' +
      '<div class="devline">' +
        '<span class="devname" ' + (u.npub ? 'data-action="view-npub" data-npub="' + esc(u.npub) + '" title="Show publisher key"' : '') + '>' + esc(u.developerName) + '</span>' +
        (u.npub ? '<span class="mono" style="color:var(--faint)">' + esc(shortKey(npubEncode(u.npub), 6)) + '</span>' : '') +
        (u.developerAddress && u.record && u.record.verify.eth ? '<span class="badge b-ver" title="Signature recovered to this address">' + icon('wallet', 10) + ' ' + shortKey(u.developerAddress, 6) + '</span>' : '') +
      '</div>' +
      '<div class="chipsrow">' +
        '<a class="chip" href="#/category/' + u.category + '">' + esc(catLabel(u.category)) + '</a>' +
        u.chains.slice(0, 6).map(c => '<span class="chip" style="cursor:default">' + esc(c) + '</span>').join('') +
      '</div>' +
      '<div class="detail-stats">' +
        '<div class="st">' + (rs.count ? rs.avg.toFixed(1) + ' ★' : '—') + '<b>' + rs.count + ' review' + (rs.count === 1 ? '' : 's') + '</b></div>' +
        '<div class="st">likes<b>' + likes + '</b></div>' +
        (u.version ? '<div class="st">version<b class="mono">' + esc(u.version) + '</b></div>' : '') +
        '<div class="st">updated<b>' + (u.updatedAt ? fmtAgo(u.updatedAt) : '—') + '</b></div>' +
        '<div class="st">source<b>' + (u.source === 'directory' ? 'Editorial' : 'Nostr network') + '</b></div>' +
      '</div>' +
    '</div>' +
    '<div class="actionbar" style="width:100%">' +
      '<button class="btn btn-primary btn-lg" data-action="open-app" data-url="' + esc(u.appUrl) + '">' + icon('ext', 16) + ' Open app</button>' +
      (u.record ? '<button class="btn ' + (liked ? 'btn-primary' : 'btn-ghost') + ' btn-lg" data-action="like" data-id="' + esc(u.id) + '">' + iconFill('heart', 16) + ' ' + (liked ? 'Liked' : 'Like') + '</button>' : '') +
      '<button class="btn ' + (pinned ? 'btn-primary' : 'btn-ghost') + ' btn-lg" data-action="pin" data-id="' + esc(u.id) + '">' + icon('bookmark', 16) + ' ' + (pinned ? 'Pinned' : 'Pin') + '</button>' +
      '<button class="btn btn-ghost btn-lg" data-action="share-app" data-id="' + esc(u.id) + '">' + icon('share', 16) + '</button>' +
    '</div></div>';
}
function trustPanelHtml(u) {
  if (!u.record) {
    return '<div class="card"><h3>' + icon('info', 16) + ' Trust</h3>' +
      '<p style="color:var(--muted);font-size:13.5px">This is an <b>editorial listing</b> — curated by the Lidex directory with links to the project\'s official website. It is not a developer-signed network listing, so no cryptographic badges apply. Always verify you are on the official domain before connecting a wallet.</p></div>';
  }
  const v = u.record.verify || {};
  const row = (ok, label, val) => {
    const ic = ok === true ? '<span style="color:var(--success)">' + icon('shield', 16) + '</span>'
      : ok === false ? '<span style="color:var(--danger)">' + icon('shieldx', 16) + '</span>'
      : '<span style="color:var(--warn)">' + icon('shieldq', 16) + '</span>';
    return '<div class="kv"><span class="k">' + ic + ' ' + label + '</span><span class="v">' + val + '</span></div>';
  };
  return '<div class="card"><h3>' + icon('shield', 16) + ' Trust & verification</h3>' +
    row(v.nostr, 'Nostr signature', v.nostr === true ? 'valid' : v.nostr === false ? 'INVALID' : 'checking…') +
    (u.eth || (u.record.eth && u.record.eth.sig) ? row(v.eth, 'Wallet signature', v.eth === true ? 'matches developer address' : v.eth === false ? 'DOES NOT match' : 'checking…') : row(null, 'Wallet signature', 'not provided')) +
    row(true, 'Publisher key', '<span class="mono" style="font-size:11px">' + esc(shortKey(npubEncode(u.npub), 10)) + ' <span data-action="copy" data-copy="' + esc(npubEncode(u.npub)) + '" style="cursor:pointer">' + icon('copy', 12) + '</span></span>') +
    row(true, 'Event id', '<span class="mono" style="font-size:11px">' + esc(u.record.eventId.slice(0, 12)) + '… <span data-action="copy" data-copy="' + esc(u.record.eventId) + '" style="cursor:pointer">' + icon('copy', 12) + '</span></span>') +
    '<p class="fhint" style="margin-top:10px">Every badge is computed in your browser from the raw signed event — nothing is trusted because a server said so. Only the publisher above can update or unpublish this listing.</p></div>';
}
function reviewsHtml(u) {
  const rs = reviewStats(u.id);
  const revs = Array.from(getReviews(u.id).entries())
    .filter(([pk, r]) => r.verify !== false)
    .sort((a, b) => b[1].at - a[1].at);
  const mine = myReview(u.id);
  const bars = [5, 4, 3, 2, 1].map(n => {
    const c = revs.filter(([pk, r]) => r.rating === n).length;
    const pct = revs.length ? (c / revs.length * 100) : 0;
    return '<div class="rev-bar"><span style="width:10px">' + n + '</span><div class="track"><div class="fill" style="width:' + pct.toFixed(0) + '%"></div></div><span style="width:22px;text-align:right">' + c + '</span></div>';
  }).join('');
  let out = '<div class="card"><h3>' + icon('msg', 16) + ' Ratings & reviews</h3>' +
    '<div class="rev-summary"><div class="rev-avg"><div class="num">' + (rs.count ? rs.avg.toFixed(1) : '—') + '</div>' +
    '<div>' + starsRow(rs.count ? rs.avg : 0) + '</div>' +
    '<div style="font-size:12px;color:var(--faint)">' + rs.count + ' review' + (rs.count === 1 ? '' : 's') + '</div></div>' +
    '<div class="rev-bars">' + bars + '</div></div>';
  if (u.record) {
    out += '<div style="margin-top:18px;padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--bg2)">' +
      '<div style="font-weight:700;font-size:13.5px;margin-bottom:10px">' + (mine ? 'Your review' + (mine.verify === false ? ' (unverified)' : '') : 'Write a review') + '</div>' +
      '<div class="starselect" id="starselect">' + [1, 2, 3, 4, 5].map(i => '<span data-star="' + i + '" class="' + (mine && mine.rating >= i ? 'on' : '') + '">' + iconFill('star', 24) + '</span>').join('') + '</div>' +
      '<textarea id="review-text" style="margin-top:10px;min-height:80px" placeholder="' + (mine ? 'Update your review…' : 'What do you think of ' + esc(u.name) + '?') + '">' + esc(mine ? mine.text : '') + '</textarea>' +
      '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px">' +
      (mine ? '<button class="btn btn-danger btn-sm" data-action="delete-review" data-id="' + esc(u.id) + '">' + icon('trash', 13) + ' Delete</button>' : '') +
      '<button class="btn btn-primary btn-sm" data-action="submit-review" data-id="' + esc(u.id) + '">' + icon('send', 13) + ' ' + (mine ? 'Update review' : 'Publish review') + '</button></div>' +
      '<p class="fhint">Reviews are signed Nostr notes tied to your publisher identity — free, no transaction.</p>' +
      '</div>';
  } else {
    out += '<p class="fhint" style="margin-top:12px">Reviews are available for network-published apps.</p>';
  }
  out += '<div style="margin-top:14px">' + (revs.length ? revs.slice(0, 30).map(([pk, r]) => {
    return '<div class="rev"><img class="avatar" src="' + avatarSvg(pk, 38) + '" width="38" height="38">' +
      '<div class="body"><div class="who"><b style="color:var(--text)">' + esc(shortKey(npubEncode(pk), 6)) + '</b>' +
      (r.verify === true ? '<span class="badge b-ver" style="padding:1px 7px">' + icon('check', 9) + ' verified</span>' : r.verify === false ? '<span class="badge b-unver" style="padding:1px 7px">unverified</span>' : '') +
      '<span>' + fmtAgo(r.at) + '</span></div>' +
      '<div>' + starsRow(r.rating) + '</div>' +
      '<div class="txt">' + linkify(r.text) + '</div></div></div>';
  }).join('') : '<p style="color:var(--faint);font-size:13.5px;padding:14px 0">No reviews yet. ' + (u.record ? 'Be the first.' : '') + '</p>') + '</div>';
  return out + '</div>';
}
function appDetailView(id) {
  const u = findApp(id);
  if (!u) return '<div class="empty"><div class="big">🧭</div><h3>App not found</h3><p>This listing doesn\'t exist locally. If you have its .lidex.json file, import it.</p>' +
    '<button class="btn btn-ghost" data-action="import">' + icon('upload', 15) + ' Import app file</button></div>';
  if (u.deleted) return '<div class="empty"><div class="big">🗑️</div><h3>Unpublished by its developer</h3><p>' + esc(u.name) + ' was removed from the network by its publisher.</p><a class="btn btn-ghost" href="#/">Back to Discover</a></div>';

  /* track view */
  if (u.source === 'network') {
    S.viewed = [u.id].concat(S.viewed.filter(x => x !== u.id)).slice(0, 12);
    clearTimeout(S._viewSave);
    S._viewSave = setTimeout(savePrefs, 1500);
  }

  const mine = S.identity && u.record && S.identity.pubkey === u.record.pubkey;
  let out = '<a class="backlink" href="#/">' + icon('chevL', 14) + ' Discover</a>';
  out += appDetailHeaderView(u);

  out += '<div class="detail-grid"><div>';
  if (u.screenshots.length) out += '<div class="shots">' + u.screenshots.map(s => '<img src="' + esc(s) + '" alt="screenshot">').join('') + '</div>';
  out += '<div class="card"><h3>About this app</h3><div class="tagline">' + esc(u.tagline) + '</div>' +
    '<div class="desc">' + linkify(u.description) + '</div>' +
    (u.tags.length ? '<div class="chipsrow" style="margin-top:14px">' + u.tags.map(t => '<span class="chip" style="cursor:default">#' + esc(t) + '</span>').join('') + '</div>' : '') +
    '</div>';
  if (u.history && u.history.length) {
    const hist = u.history.slice().reverse();
    out += '<div class="card"><h3>What\'s new</h3>' +
      hist.slice(0, 10).map(h => '<div class="histitem"><div class="v"><span class="mono">' + esc(h.version || '') + '</span><span class="t">' + (h.at ? fmtDate(h.at) : '') + '</span></div>' +
        (h.changelog ? '<div class="c">' + linkify(h.changelog) + '</div>' : '') + '</div>').join('') + '</div>';
  }
  out += reviewsHtml(u);
  out += '</div><div>';

  out += '<div class="card"><h3>Links</h3>' +
    (u.appUrl ? '<div class="sidebtns"><button class="btn btn-primary" data-action="open-app" data-url="' + esc(u.appUrl) + '">' + icon('ext', 15) + ' Open ' + esc(u.name) + '</button></div><div style="height:10px"></div>' : '') +
    '<div class="kv"><span class="k">' + icon('globe', 13) + ' App</span><span class="v"><span data-action="copy" data-copy="' + esc(u.appUrl) + '" style="cursor:pointer" class="mono" title="copy">' + esc(shortKey(u.appUrl.replace(/^https?:\/\//, ''), 18)) + '</span></span></div>' +
    (u.links && u.links.website ? '<div class="kv"><span class="k">' + icon('globe', 13) + ' Website</span><span class="v"><span data-action="open-app" data-url="' + esc(u.links.website) + '" style="cursor:pointer" class="mono">' + esc(shortKey(u.links.website.replace(/^https?:\/\//, ''), 18)) + '</span></span></div>' : '') +
    (u.links && u.links.github ? '<div class="kv"><span class="k">' + icon('github', 13) + ' GitHub</span><span class="v"><span data-action="open-app" data-url="' + esc(u.links.github) + '" style="cursor:pointer" class="mono">' + esc(shortKey(u.links.github.replace(/^https?:\/\/(www\.)?github\.com\//, ''), 18)) + '</span></span></div>' : '') +
    (u.links && u.links.twitter ? '<div class="kv"><span class="k">' + icon('twitter', 13) + ' X</span><span class="v"><span data-action="open-app" data-url="' + esc(/^https?:/i.test(u.links.twitter) ? u.links.twitter : 'https://x.com/' + u.links.twitter.replace(/^@/, '')) + '" style="cursor:pointer" class="mono">@' + esc(u.links.twitter.replace(/^@/, '').replace(/^https?:\/\/(www\.)?(x|twitter)\.com\//i, '')) + '</span></span></div>' : '') +
    '</div>';

  out += trustPanelHtml(u);

  if (mine) {
    out += '<div class="card"><h3>' + icon('user', 15) + ' You published this</h3><div class="sidebtns">' +
      '<button class="btn btn-ghost" data-action="edit-app" data-id="' + esc(u.id) + '">' + icon('edit', 14) + ' Update / edit</button>' +
      '<button class="btn btn-ghost" data-action="export-app" data-id="' + esc(u.id) + '">' + icon('download', 14) + ' Export signed file</button>' +
      '<button class="btn btn-danger" data-action="unpublish" data-id="' + esc(u.id) + '">' + icon('trash', 14) + ' Unpublish</button>' +
      '</div></div>';
  } else if (u.record) {
    out += '<div class="card"><h3>Actions</h3><div class="sidebtns">' +
      '<button class="btn btn-ghost" data-action="export-app" data-id="' + esc(u.id) + '">' + icon('download', 14) + ' Export signed file</button>' +
      '<button class="btn btn-ghost" data-action="hide-app" data-id="' + esc(u.id) + '">' + icon('eyeoff', 14) + ' Hide from my Discover</button>' +
      '</div></div>';
  }

  const similar = allApps().filter(x => x.id !== u.id && x.category === u.category).sort((a, b) => appScore(b) - appScore(a)).slice(0, 4);
  if (similar.length) out += '<div class="card"><h3>Similar apps</h3>' + similar.map(s =>
    '<div class="appcard" style="margin-bottom:10px;padding:10px 12px" data-action="open-app-card" data-id="' + esc(s.id) + '">' +
    '<div class="icon" style="width:44px;height:44px;border-radius:11px"><img src="' + esc(s.icon) + '"></div>' +
    '<div class="meta"><div class="name" style="font-size:14px"><span>' + esc(s.name) + '</span></div><div class="dev">' + esc(catLabel(s.category)) + '</div></div></div>').join('') + '</div>';
  out += '</div></div>';
  return out;
}
</script>
<script>
'use strict';
/* =====================================================================
   LIDEX — publish / update form
   ===================================================================== */
const FORM = { editing: null, v: null, busy: false, _starVal: 0 };

function formDefaults() {
  return {
    name: '', tagline: '', category: 'defi', chains: ['Ethereum'],
    tagsStr: '', version: '1.0.0', appUrl: '',
    links: { website: '', github: '', twitter: '' },
    description: '', developerName: '', developerAddress: '',
    icon: '', iconEmoji: '🚀', iconColor: 0, screenshots: [], changelog: ''
  };
}
function formIconDataUrl() {
  const v = FORM.v;
  if (v.icon) return v.icon;
  return emojiTile(v.iconEmoji, v.iconColor);
}
function formCoreEstimate() {
  const v = FORM.v;
  const core = buildManifestCore({
    name: v.name, tagline: v.tagline, description: v.description, category: v.category,
    tags: v.tagsStr.split(',').map(s => s.trim().toLowerCase()).filter(Boolean).slice(0, 5),
    chains: v.chains, version: v.version, appUrl: v.appUrl, links: v.links,
    icon: formIconDataUrl(), screenshots: v.screenshots,
    developer: { name: v.developerName || 'Anonymous', address: v.developerAddress },
    createdAt: FORM.editing ? FORM.editing.manifest.createdAt : 0, updatedAt: 0, history: []
  });
  return JSON.stringify(core).length + (v.changelog ? v.changelog.length : 0) + 300;
}
function formValues() {
  const v = FORM.v;
  return {
    name: v.name.trim(), tagline: v.tagline.trim(), category: v.category,
    chains: v.chains.slice(0, 12),
    tags: v.tagsStr.split(',').map(s => s.trim().toLowerCase().replace(/[^a-z0-9-]/g, '')).filter(Boolean).slice(0, 5),
    version: v.version.trim(), appUrl: v.appUrl.trim(),
    links: { website: v.links.website.trim(), github: v.links.github.trim(), twitter: v.links.twitter.trim() },
    description: v.description.trim(),
    developerName: (v.developerName || '').trim() || 'Anonymous',
    developerAddress: (v.developerAddress || '').trim(),
    icon: formIconDataUrl(), screenshots: v.screenshots.slice(0, 4),
    changelog: (v.changelog || '').trim()
  };
}
function publishView(editId) {
  FORM.editing = null;
  if (editId) {
    const u = findApp(editId);
    if (!u || !u.record) return '<div class="empty"><div class="big">🧭</div><h3>Listing not found</h3><p>Only network-published apps can be edited.</p></div>';
    if (!S.identity) return identityNeededView('Update your app');
    if (S.identity.pubkey !== u.record.pubkey) {
      return '<div class="empty"><div class="big">🔑</div><h3>Different publisher key</h3>' +
        '<p>This app was published by <span class="mono">' + esc(shortKey(npubEncode(u.record.pubkey), 8)) + '</span> but your current identity is <span class="mono">' + esc(shortKey(npubEncode(S.identity.pubkey), 8)) + '</span>.<br>Switch to the original identity (import its nsec in Settings) to update it.</p></div>';
    }
    const m = u.record.manifest;
    FORM.editing = u.record;
    FORM.v = {
      name: m.name, tagline: m.tagline, category: m.category, chains: (m.chains || []).slice(),
      tagsStr: (m.tags || []).join(', '),
      version: m.version, appUrl: m.appUrl,
      links: { website: (m.links && m.links.website) || '', github: (m.links && m.links.github) || '', twitter: (m.links && m.links.twitter) || '' },
      description: m.description,
      developerName: (m.developer && m.developer.name !== 'Anonymous') ? m.developer.name : '',
      developerAddress: (m.developer && m.developer.address) || '',
      icon: m.icon && m.icon.startsWith('data:image') && m.icon.length > 300 ? m.icon : '',
      iconEmoji: '🚀', iconColor: 0,
      screenshots: (m.screenshots || []).slice(),
      changelog: ''
    };
  } else {
    FORM.v = formDefaults();
    if (S.identity && S.identity.how !== 'wallet' && !S.wallet) { /* fine */ }
  }
  const v = FORM.v;
  const editing = !!FORM.editing;
  const identChip = S.identity
    ? '<span class="chip active" style="cursor:default">' + icon('key', 12) + ' ' + esc(shortKey(S.identity.npub || npubEncode(S.identity.pubkey), 5)) + '</span>'
    : '<span class="chip" data-action="ensure-identity">' + icon('key', 12) + ' Choose publisher identity</span>';
  const walletChip = S.wallet
    ? '<span class="chip active" style="cursor:default">' + icon('wallet', 12) + ' ' + shortKey(S.wallet.address, 4) + ' will sign</span>'
    : '<span class="chip" data-action="connect-wallet">' + icon('wallet', 12) + ' Connect wallet to sign (optional)</span>';

  return '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px">' +
    '<a class="backlink" style="margin:0" href="' + (editing ? '#/app/' + encodeURIComponent(editId) : '#/dev') + '">' + icon('chevL', 14) + ' Back</a>' +
    '<h2 style="font-size:23px;font-weight:800;letter-spacing:-.4px">' + (editing ? 'Update ' + esc(FORM.editing.manifest.name) : 'Publish an app') + '</h2>' +
    '<span style="flex:1"></span>' + identChip + walletChip + '</div>' +
    '<div class="pub-grid"><div class="card" style="padding:26px">' +

    (editing ? '<div class="banner info" style="margin:0 0 16px">' + icon('info', 17) + '<div class="b-body">Bump the version and describe what changed — the previous version is preserved in the app\'s public history.</div></div>' : '') +

    '<label class="f">App name <span class="opt">· required</span></label>' +
    '<input type="text" id="f-name" maxlength="60" placeholder="e.g. MoonSwap" value="' + esc(v.name) + '">' +
    '<div class="ferr" id="e-name"></div>' +

    '<label class="f">Tagline <span class="opt">· one line that sells it</span></label>' +
    '<input type="text" id="f-tagline" maxlength="140" placeholder="Swap tokens at lunar speed on Base" value="' + esc(v.tagline) + '">' +

    '<div class="two-col">' +
    '<div><label class="f">Category</label><select id="f-category">' +
      CATEGORIES.map(c => '<option value="' + c.slug + '" ' + (v.category === c.slug ? 'selected' : '') + '>' + c.label + '</option>').join('') +
    '</select></div>' +
    '<div><label class="f">Version</label><input type="text" id="f-version" placeholder="1.0.0" maxlength="24" value="' + esc(v.version) + '"></div></div>' +

    '<label class="f">App URL <span class="opt">· the dapp itself (https)</span></label>' +
    '<input type="url" id="f-appurl" placeholder="https://myapp.xyz" value="' + esc(v.appUrl) + '">' +

    '<label class="f">Chains <span class="opt">· pick all that apply</span></label>' +
    '<div class="chipsrow" id="f-chains">' + CHAINS.map(c =>

function mountPublish() {
  const v = FORM.v;
  const bind = (id, key, ev) => {
    const el = $('#' + id);
    if (!el) return;
    el.addEventListener(ev || 'input', e => {
      v[key] = e.target.type === 'url' ? e.target.value : e.target.value;

  };
  bind('f-name', 'name'); bind('f-tagline', 'tagline'); bind('f-version', 'version');

  const ghEl = $('#f-github'); if (ghEl) ghEl.addEventListener('input', e => { v.links.github = e.target.value; updatePreview(); });
  const twEl = $('#f-twitter'); if (twEl) twEl.addEventListener('input', e => { v.links.twitter = e.target.value; updatePreview(); });
  const catEl = $('#f-category'); if (catEl) catEl.addEventListener('change', e => { v.category = e.target.value; updatePreview(); });
  const chainsEl = $('#f-chains');
  if (chainsEl) chainsEl.addEventListener('click', e => {
    const c = e.target.closest('[data-chain]'); if (!c) return;
    const name = c.dataset.chain;
    if (v.chains.includes(name)) v.chains = v.chains.filter(x => x !== name);
    else v.chains.push(name);
    c.classList.toggle('active');
    updatePreview();
  });
  const emojiRow = document.querySelector('.emojirow');
  if (emojiRow) emojiRow.addEventListener('click', e => {
    const c = e.target.closest('[data-emoji]'); if (!c) return;
    v.iconEmoji = c.dataset.emoji; v.icon = '';
    document.querySelectorAll('[data-emoji]').forEach(x => x.style.borderColor = '');
    c.style.borderColor = 'var(--accent)';
    refreshIcon();
  });
  const colorsEl = $('#icon-colors');
  if (colorsEl) colorsEl.addEventListener('click', e => {
    const c = e.target.closest('[data-color]'); if (!c) return;
    v.iconColor = Number(c.dataset.color); v.icon = '';
    document.querySelectorAll('.sw').forEach(x => x.classList.remove('sel'));
    c.classList.add('sel');
    refreshIcon();
  });
  const iconFile = $('#f-iconfile');
  if (iconFile) iconFile.addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      v.icon = await processIconFile(f);
      if (!v.icon) { toast('Could not compress that image — try a PNG/JPG', 'err'); return; }
      refreshIcon(); updatePreview();
      toast('Icon ready (' + fmtBytes(v.icon.length * 0.75) + ')', 'ok');
    } catch (err) { toast('Icon failed: ' + err.message, 'err'); }
    e.target.value = '';
  });
  const shotFile = $('#f-shotfile');
  if (shotFile) shotFile.addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    if (v.screenshots.length >= 4) { toast('Max 4 screenshots', 'err'); return; }
    try {
      const budget = Math.max(8000, (CONTENT_WARN - formCoreEstimate()) / Math.max(1, 4 - v.screenshots.length));
      const du = await processShotFile(f, Math.min(14000, budget));
      if (!du) { toast('Could not compress that image', 'err'); return; }
      v.screenshots.push(du);
      rerenderShots(); updatePreview();
    } catch (err) { toast('Screenshot failed: ' + err.message, 'err'); }
    e.target.value = '';
  });
  const shotsEl = $('#f-shots');
  if (shotsEl) shotsEl.addEventListener('click', e => {
    const rm = e.target.closest('[data-rmshot]'); if (!rm) return;
    v.screenshots.splice(Number(rm.dataset.rmshot), 1);
    rerenderShots(); updatePreview();
  });
  function refreshIcon() {
    const img = $('#icon-img'); if (img) img.src = formIconDataUrl();
    updatePreview();
  }
  function rerenderShots() {
    const el = $('#f-shots'); if (!el) return;
    el.innerHTML = v.screenshots.map((s, i) =>
      '<div class="shot"><img src="' + esc(s) + '"><button class="rm" data-rmshot="' + i + '">✕</button></div>').join('') +
      (v.screenshots.length < 4 ? '<label class="btn btn-ghost btn-sm" style="height:80px;width:118px;cursor:pointer;display:flex">' + icon('plus', 15) + '<input type="file" id="f-shotfile" accept="image/*" style="display:none"></label>' : '');
    const nf = $('#f-shotfile');
    if (nf) nf.addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const budget = Math.max(8000, (CONTENT_WARN - formCoreEstimate()) / Math.max(1, 4 - v.screenshots.length));
        const du = await processShotFile(f, Math.min(14000, budget));
        if (du) { v.screenshots.push(du); rerenderShots(); updatePreview(); }
      } catch (err) { toast('Screenshot failed', 'err'); }
      e.target.value = '';
    });
  }
  const updatePreview = debounce(function () {
    const slot = $('#preview-slot'); if (!slot) return;
    const vals = formValues();
    const fake = {
      id: 'preview', source: 'network', name: vals.name || 'Your app name',
      tagline: vals.tagline, description: vals.description, category: vals.category,
      tags: vals.tags, chains: vals.chains, version: vals.version,
      appUrl: vals.appUrl, links: vals.links, icon: formIconDataUrl(),
      screenshots: vals.screenshots, developerName: vals.developerName,
      developerAddress: vals.developerAddress, npub: '', updatedAt: 0, createdAt: 0,
      record: { verify: { nostr: null, eth: null } }
    };
    slot.innerHTML = appCard(fake) + '<div class="kv"><span class="k">Package</span><span class="v" id="size-kv2">' + fmtBytes(formCoreEstimate()) + '</span></div>';
    const size = formCoreEstimate();
    const bar = $('#sizebar'), fill = $('#sizefill'), lbl = $('#size-label');
    if (bar && fill) {
      const pct = Math.min(100, size / CONTENT_MAX * 100);
      fill.style.width = pct + '%';
      bar.classList.toggle('warn', size > CONTENT_WARN && size <= CONTENT_MAX);
      bar.classList.toggle('over', size > CONTENT_MAX);
    }
    if (lbl) {
      lbl.textContent = fmtBytes(size);
      lbl.style.color = size > CONTENT_MAX ? 'var(--danger)' : size > CONTENT_WARN ? 'var(--warn)' : 'var(--faint)';
    }
  }, 120);
  updatePreview();
}
async function submitForm() {
  if (FORM.busy) return;
  const vals = formValues();
  const editing = FORM.editing;
  const errs = validateForm(vals, editing);
  if (editing && vals.version === editing.manifest.version) errs.push('Bump the version number to publish an update.');
  const errBox = $('#e-main');
  if (errs.length) {
    if (errBox) { errBox.innerHTML = errs.map(e => '• ' + esc(e)).join('<br>'); errBox.classList.add('show'); }
    else toast(errs[0], 'err');
    return;
  }
  if (errBox) { errBox.innerHTML = ''; errBox.classList.remove('show'); }

  const steps = { wallet: 'idle', nostr: 'idle', relay: 'idle' };
  const m = showModal(editing ? 'Publishing update' : 'Publishing ' + vals.name, '<div class="progress-steps" id="psteps"></div>', [], { onClose: () => {} });
  const drawSteps = () => {
    const el = m.el.querySelector('#psteps'); if (!el) return;
    const label = { wallet: 'Wallet signature (manifest hash)', nostr: 'Sign Nostr event with publisher key', relay: 'Broadcast to public relays' };
    el.innerHTML = Object.keys(steps).map(k => {
      const st = steps[k];
      return '<div class="pstep ' + (st === 'done' ? 'done' : st === 'active' ? 'active' : '') + '">' +
        '<span class="ic">' + (st === 'done' ? icon('check', 13) : st === 'active' ? '<span class="spin"></span>' : '·') + '</span>' + label[k] +
        (k === 'relay' && st === 'active' ? '<span style="margin-left:auto;font-size:12px;color:var(--faint)">relays: ' + S.net.open + ' open</span>' : '') + '</div>';
    }).join('');
  };
  drawSteps();
  FORM.busy = true;
  try {
    if (!S.identity) {
      m.close();
      const id = await ensureIdentity();
      if (!id) { FORM.busy = false; return; }
    }
    const result = await doPublish(vals, editing, (step, st) => { steps[step] = st; drawSteps(); });
    steps.relay = 'done'; drawSteps();
    m.close();
    const acc = result.pub.accepted.length;
    showModal('Published 🎉', '<p class="sub" style="margin-bottom:14px"><b>' + esc(vals.name) + ' ' + esc(vals.version) + '</b> is live.</p>' +
      '<div class="kv"><span class="k">' + icon('signal', 13) + ' Relays accepted</span><span class="v"><b style="color:' + (acc ? 'var(--success)' : 'var(--warn)') + '">' + acc + ' relay' + (acc === 1 ? '' : 's') + '</b>' + (result.pub.rejected.length ? ' · ' + result.pub.rejected.length + ' rejected' : '') + '</span></div>' +
      (acc === 0 ? '<p class="fhint" style="margin-top:10px">' + icon('warn', 12) + ' No relay was reachable — the app is saved locally and exportable as a signed file. Reconnect and re-broadcast from the Developer page.</p>' : '') +
      '<p class="fhint" style="margin-top:8px">Updates are permissionless: only your publisher key can change this listing.</p>',
      [{ label: 'Export .lidex.json', fn: () => exportApp(findApp(result.aTag)) },
       { label: 'View listing', primary: true, fn: () => go('#/app/' + encodeURIComponent(result.aTag)) }]);
    go('#/app/' + encodeURIComponent(result.aTag));
  } catch (e) {
    m.close();
    const msg = (e && e.message) || String(e);
    showModal('Could not publish', '<p class="sub">' + esc(msg) + '</p>' +
      (msg.includes('wallet') || msg.includes('sign') ? '' : ''), [{ label: 'Close' }]);
  } finally {
    FORM.busy = false;
  }
}

<script>
'use strict';

/* ---------------- developer dashboard ---------------- */
function devView() {
  if (!S.identity) {
    return '<div class="empty" style="margin-top:20px"><div class="big">🛠️</div><h3>Become a publisher in one step</h3>' +

    '<img class="av" src="' + avatarSvg(myPubkey, 74) + '" width="74" height="74">' +
    '<div style="flex:1;min-width:220px"><h2>Publisher dashboard</h2>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;align-items:center">' +
    '<span class="chip" style="cursor:default">' + icon('key', 12) + ' ' + esc(shortKey(S.identity.npub || npubEncode(myPubkey), 8)) + '</span>' +
    (S.identity.wallet ? '<span class="chip" style="cursor:default">' + icon('wallet', 12) + ' ' + esc(shortKey(S.identity.wallet, 4)) + '</span>' : '') +
    '<span class="chip" style="cursor:default">' + (S.identity.how === 'wallet' ? 'derived from wallet' : S.identity.how === 'nsec' ? 'imported nsec' : 'local key') + '</span></div></div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
